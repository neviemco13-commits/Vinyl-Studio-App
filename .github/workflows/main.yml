name: Build Vinyl Studio APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VinylStudioAndroid-V1.1-GitHub-Actions/VinylStudioAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Vinyl-Studio-debug
          path: VinylStudioAndroid-V1.1-GitHub-Actions/VinylStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
